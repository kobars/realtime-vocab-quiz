# AI-ASSISTED: CI: make check, the Redis integration tests, the acceptance tests on both stores,
# the visual and accessibility specs and the combined coverage gate, on pull requests, on main and
# weekly; the PR guards and the review budget on pull requests.
name: ci

on:
  pull_request:
    # A label change runs the workflow again, so the guards read the new labels.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  # Upstream drift (the runner, Node, the Redis image) fails here without a code change.
  schedule:
    - cron: "29 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a PR replaces its older run; runs on main always finish.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The weekly run tries ten times as many examples per property (api/tests/conftest.py).
  HYPOTHESIS_PROFILE: ${{ github.event_name == 'schedule' && 'scheduled' || 'ci' }}
  # The Makefile writes each test step's JUnit report here; upload-test-results uploads them.
  REPORTS: reports

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'schedule' && 30 || 10 }}
    env:
      COVERAGE_FILE: ${{ github.workspace }}/reports/.coverage.unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # make check includes the contract drift step and the acceptance tests on the memory store.
      - run: make check
      - if: always()
        uses: ./.github/actions/upload-test-results
        with:
          name: unit

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'schedule' && 30 || 10 }}
    services:
      redis:
        image: redis:8.10-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      REDIS_URL: redis://localhost:6379/0
      COVERAGE_FILE: ${{ github.workspace }}/reports/.coverage.integration
      # The combined report holds the floor, so these partial runs have none; the acceptance run
      # appends to the integration run's data.
      PYTEST_ADDOPTS: --cov --cov-report= --cov-fail-under=0 --cov-append
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      # The integration tests, then the acceptance tests on Redis.
      - run: make test-integration
      - if: always()
        uses: ./.github/actions/upload-test-results
        with:
          name: integration

  # The visual and accessibility specs (web/e2e/visual.spec.ts, web/e2e/a11y.spec.ts) in the pinned Playwright
  # image that renders the baselines; the report and the screenshot diffs are kept when they fail.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make ui-check
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-report
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore

  # Combines the coverage-* artifacts; a job that uploads one joins the report by being listed in
  # needs. On a PR it also gates the changed lines.
  coverage:
    needs: [check, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # diff-cover diffs against the base branch
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: reports
          merge-multiple: true
      # fail_under in api/pyproject.toml is the floor; the summary is written before the check.
      - name: Combined coverage
        working-directory: api
        run: |
          uv run --locked coverage combine ../reports
          uv run --locked coverage xml -o ../coverage.xml --fail-under=0
          echo "Combined coverage: $(uv run --locked coverage report --format=total --fail-under=0)%" >> "$GITHUB_STEP_SUMMARY"
          uv run --locked coverage report
      - name: Diff coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          rc=0
          uv run --project api --locked diff-cover coverage.xml --compare-branch="origin/$BASE_REF" \
            --fail-under=90 --format markdown:diff-cover.md || rc=$?
          cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  # The rules of AGENTS.md (scripts/check_pr.py); a label lets a PR past the frozen-path or size rule.
  guards:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: |
          mapfile -t labels < <(jq -r '.[]' <<< "$PR_LABELS")
          uv run --project api --locked python scripts/check_pr.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" --pr "$PR_NUMBER" --labels "${labels[@]}"

  # The PR's review input in tokens (scripts/review_budget.py); it fails at the limit.
  review-budget:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      TIKTOKEN_CACHE_DIR: /tmp/tiktoken
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TIKTOKEN_CACHE_DIR }}
          key: tiktoken-o200k_base
      - run: make review-budget

  # The ruleset requires this job only; a job joins the gate by being listed in needs.
  ci-required:
    if: always()
    needs: [check, integration, ui, coverage, guards, review-budget]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A skipped job passes, so a job that runs only on some events never blocks a merge.
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  scheduled-failure:
    if: failure() && github.event_name == 'schedule'
    needs: [check, integration, coverage]
    permissions:
      issues: write
    uses: ./.github/workflows/scheduled-failure.yml
