# AI-ASSISTED: container and infrastructure checks: Dockerfile, shell and compose lint, Trivy scans, image smoke test.
name: containers

on:
  pull_request:
  push:
    branches: [main]
  # New image advisories and base image drift fail here without a code change.
  schedule:
    - cron: "53 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# compose reads the whole of compose.yaml in every command, so the full stack's required secrets
# must be set; no stack runs here.
env:
  ADMIN_TOKEN: unused
  REDIS_PASSWORD: unused

concurrency:
  # A new push to a PR replaces its older run; runs on main always finish.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: hadolint
        # Reads .hadolint.yaml from the repository root.
        run: git ls-files -z '*Dockerfile' | xargs -0 docker run --rm -v "$PWD:/repo:ro" -w /repo hadolint/hadolint:v2.15.1 hadolint
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck
      - name: compose config
        run: git ls-files -z 'compose*.yaml' 'compose*.yml' | xargs -0 -I{} docker compose -f {} config -q
      - name: trivy config
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          exit-code: "1"

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The scheduled run uploads the image scans to code scanning.
      security-events: write
    env:
      IMAGE_TAG: ci
      # The scheduled run writes each image scan as SARIF; other runs print a table.
      TRIVY_FORMAT: ${{ github.event_name == 'schedule' && 'sarif' || 'table' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make build
      - name: non-root, read-only smoke test
        run: scripts/smoke_images.sh "$IMAGE_TAG"
      - name: nginx -t
        run: scripts/check_nginx.sh "$IMAGE_TAG"
      - name: trivy image (api)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: elsaquiz-api:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: ${{ env.TRIVY_FORMAT }}
          output: ${{ github.event_name == 'schedule' && 'trivy-api.sarif' || '' }}
          limit-severities-for-sarif: true
      - name: trivy image (web)
        # Scans the web image even when the api scan fails, so the scheduled upload has both.
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: elsaquiz-web:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
          format: ${{ env.TRIVY_FORMAT }}
          output: ${{ github.event_name == 'schedule' && 'trivy-web.sarif' || '' }}
          limit-severities-for-sarif: true
      - name: upload the api scan
        if: ${{ !cancelled() && github.event_name == 'schedule' && hashFiles('trivy-api.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api
      - name: upload the web scan
        if: ${{ !cancelled() && github.event_name == 'schedule' && hashFiles('trivy-web.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-web.sarif
          category: trivy-web

  # The ruleset requires this job only; a job joins the gate by being listed in needs.
  containers-required:
    if: always()
    needs: [config, images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A skipped job passes, so a job that runs only on some events never blocks a merge.
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  scheduled-failure:
    if: failure() && github.event_name == 'schedule'
    needs: [config, images]
    permissions:
      issues: write
    uses: ./.github/workflows/scheduled-failure.yml
