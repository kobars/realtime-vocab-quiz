# AI-ASSISTED: container and infrastructure checks: Dockerfile, shell and compose lint, Trivy scans,
# image smoke test; on main and on release tags, the scanned multi-arch images published to GHCR.
name: containers

on:
  pull_request:
  push:
    branches: [main]
    # A release: its images are tagged with the version (docs/operations.md, "Image tags").
    tags: ["v*.*.*"]
  # New image advisories and base image drift fail here without a code change.
  schedule:
    - cron: "53 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# compose reads the whole of compose.yaml in every command, so the full stack's required secrets
# must be set; no stack runs here.
env:
  ADMIN_TOKEN: unused
  REDIS_PASSWORD: unused

concurrency:
  # A new push to a PR replaces its older run; runs on main always finish.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: hadolint
        # Reads .hadolint.yaml from the repository root.
        run: git ls-files -z '*Dockerfile' | xargs -0 docker run --rm -v "$PWD:/repo:ro" -w /repo hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d hadolint
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck
      - name: compose config
        run: docker compose config -q
      - name: compose config of the public host
        # compose.prod.yaml is an override: it runs on top of compose.yaml.
        env:
          DOMAIN: unused.example
          ALLOWED_ORIGINS: https://unused.example
        run: docker compose -f compose.yaml -f compose.prod.yaml config -q
      - name: compose config of the public host on the published images
        env:
          DOMAIN: unused.example
          ALLOWED_ORIGINS: https://unused.example
        run: docker compose -f compose.yaml -f compose.prod.yaml -f compose.images.yaml config -q
      - name: trivy config
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          exit-code: "1"

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The scheduled run uploads the image scans to code scanning.
      security-events: write
    env:
      IMAGE_TAG: ci
      # The scheduled run writes each image scan as SARIF; other runs print a table.
      TRIVY_FORMAT: ${{ github.event_name == 'schedule' && 'sarif' || 'table' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make build
        id: build
      - name: non-root, read-only smoke test
        run: scripts/smoke_images.sh "$IMAGE_TAG"
      - name: nginx -t
        run: scripts/check_nginx.sh "$IMAGE_TAG"
      - name: trivy image (api)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: elsaquiz-api:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: ${{ env.TRIVY_FORMAT }}
          output: ${{ github.event_name == 'schedule' && 'trivy-api.sarif' || '' }}
          limit-severities-for-sarif: true
      - name: trivy image (web)
        # Scans the web image even when the api scan fails, so the scheduled upload has both.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: elsaquiz-web:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: ${{ env.TRIVY_FORMAT }}
          output: ${{ github.event_name == 'schedule' && 'trivy-web.sarif' || '' }}
          limit-severities-for-sarif: true
      - name: upload the api scan
        if: ${{ !cancelled() && github.event_name == 'schedule' && hashFiles('trivy-api.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api
      - name: upload the web scan
        if: ${{ !cancelled() && github.event_name == 'schedule' && hashFiles('trivy-web.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-web.sarif
          category: trivy-web

  # Each platform's images, built on a native runner and pushed by digest only (no tag), then
  # scanned there as pulled; publish-tags tags them once every scan has passed. Runs on main and on
  # release tags of this repository (not of a fork), after the checks above.
  publish:
    if: github.event_name == 'push' && github.repository == 'kobars/realtime-vocab-quiz'
    needs: [config, images]
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      TRIVY_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push the api image
        id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: api/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # The SBOM and the build's full provenance go into the registry with the image.
          sbom: true
          provenance: mode=max
          outputs: type=image,name=ghcr.io/kobars/realtime-vocab-quiz-api,push-by-digest=true,name-canonical=true,push=true
      - name: build and push the web image
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
          outputs: type=image,name=ghcr.io/kobars/realtime-vocab-quiz-web,push-by-digest=true,name-canonical=true,push=true
      - name: trivy image (api)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/kobars/realtime-vocab-quiz-api@${{ steps.api.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: trivy image (web)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/kobars/realtime-vocab-quiz-web@${{ steps.web.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: record the digests
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir digests
          printf '%s\n' "$API_DIGEST" > "digests/api-${PLATFORM#linux/}"
          printf '%s\n' "$WEB_DIGEST" > "digests/web-${PLATFORM#linux/}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ strategy.job-index }}
          path: digests/
          retention-days: 1

  # One multi-arch image per name from the scanned digests, tagged main and the commit's short SHA
  # on main, or the version on a release tag; then a signed provenance attestation for each.
  publish-tags:
    if: github.event_name == 'push' && github.repository == 'kobars/realtime-vocab-quiz'
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: tag the images
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case $GITHUB_REF in
            refs/heads/main)
              tags=("${GITHUB_SHA::7}")
              # Runs on main overlap: an older run that finishes after a newer one must not move
              # main back to its images.
              head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
              if [[ $head == "$GITHUB_SHA" ]]; then
                tags=(main "${tags[@]}")
              else
                echo "main is at $head now: tagging ${GITHUB_SHA::7} only"
              fi ;;
            refs/tags/v*)
              [[ $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a vX.Y.Z tag: $GITHUB_REF_NAME"; exit 1; }
              tags=("$GITHUB_REF_NAME") ;;
            *) echo "no image tag for $GITHUB_REF"; exit 1 ;;
          esac
          for name in api web; do
            image=ghcr.io/kobars/realtime-vocab-quiz-$name
            docker buildx imagetools create "${tags[@]/#/--tag=$image:}" \
              --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              "$image@$(cat "digests/$name-amd64")" "$image@$(cat "digests/$name-arm64")"
            digest=$(docker buildx imagetools inspect "$image:${tags[0]}" --format '{{json .Manifest}}' | jq -r .digest)
            echo "$name=$digest" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/kobars/realtime-vocab-quiz-api
          subject-digest: ${{ steps.tag.outputs.api }}
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/kobars/realtime-vocab-quiz-web
          subject-digest: ${{ steps.tag.outputs.web }}
          push-to-registry: true

  # The ruleset requires this job only; a job joins the gate by being listed in needs.
  containers-required:
    if: always()
    needs: [config, images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A skipped job passes, so a job that runs only on some events never blocks a merge.
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  scheduled-failure:
    if: failure() && github.event_name == 'schedule'
    needs: [config, images]
    permissions:
      issues: write
    uses: ./.github/workflows/scheduled-failure.yml
