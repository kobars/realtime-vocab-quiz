# AI-ASSISTED: OpenSSF Scorecard: supply-chain checks of the repository, published and sent to code scanning.
name: scorecard

# Publishing the results limits this workflow to the steps and keys that Scorecard verifies.
on:
  push:
    branches: [main]
  schedule:
    - cron: "11 5 * * 1"
  # Scorecard reads the branch protection settings, which no push changes.
  branch_protection_rule:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write
      # Signs the published results.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
