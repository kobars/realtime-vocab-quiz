# AI-ASSISTED: OpenSSF Scorecard: supply-chain checks of the repository, published and sent to code scanning.
name: scorecard

# Publishing the results limits this workflow to what Scorecard verifies: no top-level env,
# defaults or write permission, and only the analysis job may write id-token. That job also takes
# no env, defaults, container or services, runs on a GitHub-hosted Ubuntu runner and uses only the
# actions Scorecard lists (https://github.com/ossf/scorecard-action#workflow-restrictions). Other
# jobs, like scheduled-failure, may run.
on:
  push:
    branches: [main]
  schedule:
    - cron: "11 5 * * 1"
  # Scorecard reads the branch protection settings, which no push changes.
  branch_protection_rule:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write
      # Signs the published results.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif

  scheduled-failure:
    if: failure() && github.event_name == 'schedule'
    needs: [analysis]
    permissions:
      issues: write
    uses: ./.github/workflows/scheduled-failure.yml
