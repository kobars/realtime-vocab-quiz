# AI-ASSISTED: the composed stack behind nginx, and behind Caddy's HTTPS: the system tests and the browser specs, on PRs that change it and nightly.
name: stack

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a PR replaces its older run; runs on main always finish.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The filter is a job, not on.pull_request.paths, so the gate below reports on every PR.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stack: ${{ steps.diff.outputs.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo stack=true >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE...$HEAD" | grep -qE '^(api/|web/|infra/|compose[^/]*\.ya?ml$|(.*/)?Dockerfile$|\.dockerignore$|Makefile$|\.nvmrc$|\.python-version$|\.github/workflows/stack\.yml$)'; then
            echo stack=true >> "$GITHUB_OUTPUT"
          else
            echo stack=false >> "$GITHUB_OUTPUT"
          fi

  stack:
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [system, browser]
    env:
      IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.suite == 'system'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - if: matrix.suite == 'browser'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - if: matrix.suite == 'browser'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - if: matrix.suite == 'browser'
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web exec playwright install --with-deps chromium
      - name: stack secrets
        run: printf 'ADMIN_TOKEN=%s\nREDIS_PASSWORD=%s\n' "$(openssl rand -hex 24)" "$(openssl rand -hex 24)" > .env
      - run: make build
      - run: docker compose --profile full up --wait --wait-timeout 120
      - run: make test-${{ matrix.suite }}
      - if: failure()
        run: docker compose --profile full logs --no-color --timestamps > stack-logs.txt
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stack-logs-${{ matrix.suite }}
          path: stack-logs.txt
      - if: always() && matrix.suite == 'browser'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore

  # compose.prod.yaml on top: Caddy in front with a certificate from its local CA, and the system
  # tests over HTTPS and wss, the edge's per-client addresses included (tests/system/test_edge.py).
  prod:
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE_TAG: ci
      STACK_URL: https://localhost
      SSL_CERT_FILE: ${{ github.workspace }}/caddy-root.crt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: stack settings
        run: printf 'DOMAIN=localhost\nALLOWED_ORIGINS=https://localhost\nTLS_ISSUER=internal\nADMIN_TOKEN=%s\nREDIS_PASSWORD=%s\n' "$(openssl rand -hex 24)" "$(openssl rand -hex 24)" > .env
      - run: make prod-up
      - name: trust Caddy's local CA
        # Caddy writes its root certificate once it has issued the first one.
        run: |
          for _ in $(seq 30); do
            docker compose -f compose.yaml -f compose.prod.yaml cp caddy:/data/caddy/pki/authorities/local/root.crt "$SSL_CERT_FILE" && break
            sleep 1
          done
          curl --fail --silent --show-error --retry 10 --retry-all-errors --cacert "$SSL_CERT_FILE" "$STACK_URL/api/readyz"
      - run: make test-system
      - if: failure()
        run: docker compose -f compose.yaml -f compose.prod.yaml --profile full logs --no-color --timestamps > stack-logs.txt
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stack-logs-prod
          path: stack-logs.txt

  # A job joins the gate by being listed in needs.
  stack-required:
    if: always()
    needs: [changes, stack, prod]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A skipped job passes, so a PR that leaves the stack alone never blocks a merge.
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  scheduled-failure:
    if: failure() && github.event_name == 'schedule'
    needs: [changes, stack, prod]
    permissions:
      issues: write
    uses: ./.github/workflows/scheduled-failure.yml
