# AI-ASSISTED: pre-commit hooks: ruff, ESLint, typos and Markdown links.
# make check runs them on every file, so the hooks and CI check the same things.
# Install once with `uv run --project api pre-commit install`; the hooks use the locked tools.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff lint
        entry: bash -c 'cd api && uv run --locked ruff check --force-exclude "${@/#/../}"' --
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd api && uv run --locked ruff format --check --force-exclude "${@/#/../}"' --
        language: system
        types: [python]
      - id: eslint
        name: eslint
        entry: bash -c 'cd web && pnpm exec eslint --max-warnings 0 --no-warn-ignored "${@/#web\//}"' --
        language: system
        files: ^web/.*\.(js|ts|vue)$
        # Each eslint process builds the TypeScript program for the type-aware rules, so one process lints every file.
        require_serial: true
      - id: typos
        name: typos
        entry: uv run --project api --locked typos --force-exclude
        language: system
      - id: markdown-links
        name: markdown links
        # A heading change can break links in other files, so every Markdown file is checked.
        entry: scripts/check_links.sh --offline
        language: system
        files: \.md$
        pass_filenames: false
