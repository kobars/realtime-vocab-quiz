# AI-ASSISTED: project metadata, dependency set and build backend chosen at bootstrap.
[project]
name = "quiz"
version = "0.1.0"
description = "Real-time vocabulary quiz service: WebSocket gateway, scoring and live leaderboard."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "prometheus-client>=0.26.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "redis[hiredis]>=8.1.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.168.3",
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
load = [
    "websockets>=17.1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the formatter
    "CPY001", # no per-file copyright headers
    "D",      # docstrings are written where they help, not everywhere
    "INP001", # tests/ and scripts/ are plain folders, not packages
    "TC001",  # annotations are lazy on Python 3.14, so runtime imports cost nothing
    "TC002",
    "TC003",
]

[tool.ruff.lint.isort]
known-first-party = ["quiz", "check_internal"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"../scripts/tests/**" = ["S101", "PLR2004"]
"../scripts/*.py" = ["S603", "T201"]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = ["src", "../scripts"]
files = ["src", "tests", "../scripts"]
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests", "../scripts/tests"]
pythonpath = ["../scripts"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "unit: fast tests of pure code (set by folder)",
    "property: Hypothesis property tests (set by folder)",
    "contract: wire-contract tests (set by folder)",
    "integration: tests that need Redis; REDIS_URL or a container (set by folder)",
    "acceptance: the locked acceptance tests (set by folder)",
    "slow: tests that take more than a second",
]
