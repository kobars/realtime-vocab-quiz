# AI-ASSISTED: project metadata, dependency set and build backend chosen at bootstrap.
[project]
name = "quiz"
version = "0.1.0"
description = "Real-time vocabulary quiz service: WebSocket gateway, scoring and live leaderboard."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "prometheus-client>=0.26.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "redis[hiredis]>=8.1.0",
    "starlette>=1.7.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.1",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "anyio>=4.15.1",
    "deptry>=0.25.1",
    "diff-cover>=10.6.0",
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "hypothesis>=6.168.3",
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.9",
    "tiktoken>=0.14.0",
    "typos>=1.50.3",
    "zizmor>=1.30.1",
]
load = [
    "httpx>=0.28.1",
    "websockets>=17.1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the formatter
    "CPY001", # no per-file copyright headers
    "D",      # docstrings are written where they help, not everywhere
    "INP001", # tests/ and scripts/ are plain folders, not packages
    "TC001",  # annotations are lazy on Python 3.14, so runtime imports cost nothing
    "TC002",
    "TC003",
]

[tool.ruff.lint.isort]
known-first-party = [
    "quiz", "check_pr", "pr_changes", "review_budget", "check_junit_skips", "bots", "latency",
    "player", "smoke_full",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"../scripts/tests/**" = ["S101", "PLR2004"]
"../scripts/*.py" = ["S603", "T201"]
"../load/*.py" = ["T201"]
"../load/tests/**" = ["S101", "PLR2004"]

# The review input of a PR in o200k_base tokens (scripts/review_budget.py): a notice, a warning,
# and the limit at which the review-budget job fails.
[tool.review-budget]
info = 100000
warning = 150000
limit = 200000

# make check runs deptry on src, and on tests, ../scripts and ../load with the Makefile's extra flags.
[tool.deptry]
known_first_party = ["quiz"]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = ["src", "../scripts", "../load"]
files = ["src", "tests", "../scripts", "../load"]
# Test folders have no __init__.py: name modules by path so same-named test files can coexist.
explicit_package_bases = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined",
    "explicit-override", "unused-awaitable", "mutable-override", "deprecated",
]

# pre-commit ships no py.typed; its sources are typed, so read them instead of skipping them.
[[tool.mypy.overrides]]
module = ["pre_commit.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests", "../scripts/tests", "../load/tests"]
pythonpath = ["../scripts", "../load"]
# importlib mode lets test files in different folders share a basename without __init__.py.
addopts = ["--strict-markers", "--strict-config", "-ra", "--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
# A hung test fails in a minute with every thread's stack; the default signal method fails only
# that test, so the rest of the run, its fixture teardown and its summary still happen.
timeout = 60
filterwarnings = ["error"]
markers = [
    "unit: fast tests of pure code (set by folder)",
    "property: Hypothesis property tests (set by folder)",
    "contract: wire-contract tests (set by folder)",
    "integration: tests that need Redis; REDIS_URL or a container (set by folder)",
    "acceptance: the locked acceptance tests (set by folder)",
    "slow: tests that take more than a second",
]

# make check runs the unit, property and contract tests with --cov; the Redis adapter and the
# WebSocket gateway are covered mostly by the integration tests, which it does not run. CI
# combines the coverage data of its test jobs.
[tool.coverage.run]
branch = true
source_pkgs = ["quiz"]

[tool.coverage.report]
# The floor of CI's combined report, below its measured 98%; make check's unit-only run has its
# own floor in the Makefile.
fail_under = 95
show_missing = true
skip_covered = true

# The layer rules. main is the composition root: it may import everything, and nothing imports it.
[tool.importlinter]
root_package = "quiz"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The domain imports nothing outside itself"
type = "forbidden"
source_modules = ["quiz.domain"]
forbidden_modules = [
    "quiz.contracts", "quiz.ports", "quiz.app", "quiz.adapters", "quiz.fanout", "quiz.obs",
    "quiz.config", "quiz.main", "pydantic", "pydantic_settings", "fastapi", "starlette", "redis",
    "uvicorn", "structlog", "prometheus_client",
]

[[tool.importlinter.contracts]]
name = "Ports and use cases depend only on the domain, the ports and the wire contracts"
type = "forbidden"
source_modules = ["quiz.ports", "quiz.app"]
forbidden_modules = [
    "quiz.adapters", "quiz.fanout", "quiz.config", "quiz.main", "redis", "fastapi", "starlette",
    "uvicorn", "pydantic_settings",
]

[[tool.importlinter.contracts]]
name = "Ports never import the use cases"
type = "forbidden"
source_modules = ["quiz.ports"]
forbidden_modules = ["quiz.app"]

[[tool.importlinter.contracts]]
name = "Adapters never import each other"
type = "independence"
modules = [
    "quiz.adapters.memory", "quiz.adapters.redis", "quiz.adapters.mock_auth",
    "quiz.adapters.mock_questions", "quiz.adapters.http",
]

[[tool.importlinter.contracts]]
name = "Store and mock adapters depend only on the ports, the domain and the wire contracts"
type = "forbidden"
source_modules = [
    "quiz.adapters.memory", "quiz.adapters.redis", "quiz.adapters.mock_auth",
    "quiz.adapters.mock_questions",
]
forbidden_modules = [
    "quiz.app", "quiz.fanout", "quiz.config", "quiz.main", "fastapi", "starlette", "uvicorn",
    "pydantic_settings",
]

[[tool.importlinter.contracts]]
name = "Nothing imports the composition root"
type = "forbidden"
source_modules = [
    "quiz.domain", "quiz.contracts", "quiz.ports", "quiz.app", "quiz.adapters", "quiz.fanout",
    "quiz.obs", "quiz.config",
]
forbidden_modules = ["quiz.main"]
