# AI-ASSISTED: the full stack on a public host: Caddy terminates HTTPS for ${DOMAIN} on 80 and 443
# and proxies to nginx over an edge network of their own; nginx publishes no port and takes the
# client's address from Caddy's X-Forwarded-For. Used as an override of compose.yaml (make prod-up;
# docs/operations.md, "Deploy to a VM").

x-prod-api: &prod-api
  environment:
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS in .env}

services:
  caddy:
    profiles: [full]
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE] # 80 and 443
    security_opt: ["no-new-privileges:true"]
    ulimits:
      nofile: 65536
    ports:
      - "80:80" # the ACME HTTP challenge and the redirect to HTTPS
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      TLS_ISSUER: ${TLS_ISSUER:-acme} # acme (Let's Encrypt) or internal (a local CA, for tests)
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # the certificates and the ACME account: kept across restarts
      - caddy-config:/config
    networks: [edge]
    depends_on:
      nginx:
        condition: service_healthy

  nginx:
    ports: !reset []
    networks: [stack, edge]
    # The image's entrypoint writes the template into /tmp/edge/, which nginx.conf includes.
    volumes:
      - ./infra/nginx/real-ip.conf.template:/etc/nginx/templates/edge/real-ip.conf.template:ro
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /tmp
      EDGE_SUBNET: &edge-subnet ${EDGE_SUBNET:-10.89.79.0/24}

  api-1: *prod-api
  api-2: *prod-api

  # make prod-demo: the player URL on the public origin.
  seed:
    command: ["python", "/opt/seed.py", "--public-url", "https://${DOMAIN:?set DOMAIN in .env}"]

networks:
  # Caddy and nginx only: nginx trusts X-Forwarded-For from this subnet.
  edge:
    ipam:
      config:
        - subnet: *edge-subnet

volumes:
  caddy-data:
  caddy-config:
