# AI-ASSISTED: the development Redis (profile dev), the full stack (profile full): two API nodes on
# one Redis behind nginx, the only service that publishes a port, each restarted after a crash
# unless it was stopped; the bot swarm (profile load), the demo's seed and bots (profile demo) and
# the tests (profile test), none needing uv or pnpm on the host.
name: elsaquiz

x-hardened: &hardened
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  ulimits:
    nofile: 65536
  networks: [stack]
  profiles: [full]

x-redis-health: &redis-health
  test: ["CMD", "redis-cli", "ping"]
  interval: 2s
  timeout: 2s
  retries: 15

x-api: &api
  <<: *hardened
  image: elsaquiz-api:${IMAGE_TAG:-dev}
  restart: unless-stopped
  depends_on:
    stack-redis:
      condition: service_healthy

# The password goes into a URL: use URL-safe characters (openssl rand -hex 24).
x-api-env: &api-env
  STORE: redis
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@stack-redis:6379/0
  ADMIN_MOCK: "1"
  ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
  QUIZ_PORT: ${QUIZ_PORT:-8080}
  PER_IP_CONN_CAP: # from .env when set: every client of the 127.0.0.1 port shares one address
  REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-100} # each served quiz holds one subscription
  # nginx is the nodes' only proxy, but a host process can reach a node from the bridge gateway's
  # address in this subnet and set X-Forwarded-For: accepted, as the stack serves the local host.
  TRUSTED_PROXIES: ${QUIZ_SUBNET:-10.89.78.0/24}

services:
  redis:
    profiles: [dev]
    image: redis:8.10-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:6381:6379" # local only: the development Redis has no password
    volumes:
      - redis-data:/data # named, so `make down` (no -v) keeps the AOF data
    healthcheck: *redis-health

  stack-redis:
    <<: *hardened
    image: redis:8.10-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    user: redis # the entrypoint then runs the server as is, with no capability to drop to it
    restart: unless-stopped
    # When full it refuses writes rather than evict a quiz's keys (docs/spec/redis.md §5, failures).
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env} # for the healthcheck
    volumes:
      - stack-redis-data:/data
    healthcheck: *redis-health

  # The API and web images bring their own healthchecks.
  api-1:
    <<: *api
    environment:
      <<: *api-env
      NODE_ID: api-1

  api-2:
    <<: *api
    environment:
      <<: *api-env
      NODE_ID: api-2

  web:
    <<: *hardened
    image: elsaquiz-web:${IMAGE_TAG:-dev}
    restart: unless-stopped

  # The web image's nginx build, with its security-headers snippet, runs the edge config.
  nginx:
    <<: *hardened
    image: elsaquiz-web:${IMAGE_TAG:-dev}
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${QUIZ_PORT:-8080}:8080"
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
      web:
        condition: service_healthy

  # The bot swarm (make load); it reaches the full stack through nginx on the stack network.
  load: &load
    <<: *hardened # its nofile limit gives one descriptor per bot socket
    profiles: [load]
    image: elsaquiz-load # one image for this service and the demo's bots
    build:
      context: .
      dockerfile: load/Dockerfile
    environment:
      LOAD_URL: ${LOAD_URL:-http://nginx:8080/api}
    volumes:
      - ./load/results:/app/results

  # make new-quiz and make demo: a fresh 60-minute run of a bank quiz, through nginx; make demo-end
  # ends a quiz as the mock host.
  seed:
    <<: *hardened
    profiles: [demo]
    image: elsaquiz-api:${IMAGE_TAG:-dev}
    volumes:
      - ./scripts/seed.py:/opt/seed.py:ro
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      QUIZ_PORT: ${QUIZ_PORT:-8080}
    command: ["python", "/opt/seed.py"]

  # make demo: DEMO_BOTS bots each play DEMO_QUIZ_ID once, so the board holds about the bots and
  # the people who join; make demo-stop removes them. Its result file stays in the container, so
  # it writes as any user.
  bots:
    <<: *load
    profiles: [demo]
    volumes: []
    tmpfs: [/tmp, /app/results]
    command:
      - --quiz-ids=${DEMO_QUIZ_ID:-}
      - --bots=${DEMO_BOTS:-20}
      - --cohorts=1
      - --duration=3600
      - --origin=http://localhost:${QUIZ_PORT:-8080} # an origin the API allows
      - --label=demo

  # docker compose --profile test run --rm test: make test and the acceptance tests on the memory
  # store, in the repository image of infra/dev/Dockerfile, rebuilt from the checkout on every run.
  test:
    profiles: [test]
    image: elsaquiz-dev:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: infra/dev/Dockerfile
    pull_policy: build
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["make", "test", "acceptance"]

networks:
  stack:
    ipam:
      config:
        - subnet: ${QUIZ_SUBNET:-10.89.78.0/24}

volumes:
  redis-data:
  stack-redis-data:
