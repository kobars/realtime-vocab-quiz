# AI-ASSISTED: the edge of the full stack: / to the web app, /api/ (prefix dropped) and /ws to the
# two API nodes, round-robin with no sticky sessions; a node that refuses fails over to the other.
worker_processes auto;
worker_rlimit_nofile 65536;
pid /tmp/nginx.pid;
# An error line quotes the request line, ticket included; a ticket is single use and lives 30 s.
error_log /dev/stderr warn;

events {
    worker_connections 16384; # each proxied socket holds two: the client's and the node's
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server_tokens off;
    client_max_body_size 16k;
    # A client that stalls between two reads of its request, or two writes of the response, is cut
    # (408, or the connection closes): a slow request cannot hold an edge connection for long.
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;

    # $uri, never $request or $request_uri: the WebSocket ticket is in the query string.
    log_format edge '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent $request_time $upstream_addr';
    access_log /dev/stdout edge;

    # Behind Caddy on a public host (compose.prod.yaml), the client's address from its
    # X-Forwarded-For; locally this matches no file.
    include /tmp/edge/*.conf;

    # Docker's DNS, read again while running: a node that restarts may come back on a new address.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # No passive failure marking: a 503 comes from the Redis both nodes share, so marking would take
    # out both; a stopped node's connect fails over, and its name leaves Docker's DNS within 5 s.
    upstream api {
        zone api 64k;
        server api-1:8000 resolve max_fails=0;
        server api-2:8000 resolve max_fails=0;
    }

    upstream web {
        zone web 64k;
        server web:8080 resolve;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    # Every client of the 127.0.0.1-only port arrives from Docker's one address, so this is a flood
    # ceiling for the whole stack, above a load run's joins; the nodes limit each address. Behind
    # Caddy, this zone and the next count each client's own address.
    limit_req_zone $binary_remote_addr zone=identity:10m rate=1000r/s;
    limit_req_status 429;
    # The same single address makes this a cap on the stack's API requests in flight (503 above
    # it), above the bot swarm's 100 HTTP connections per process at 10 processes.
    limit_conn_zone $binary_remote_addr zone=api_conn:10m;

    server {
        listen 8080;
        server_name _;
        absolute_redirect off;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # The client's own address, never one it sent: the nodes trust this header from nginx.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_503;

        # The web app sends the security headers itself.
        location / {
            proxy_pass http://web;
        }

        location /api/ {
            include /etc/nginx/security-headers.conf;
            proxy_pass http://api/;
            proxy_redirect http://$http_host/ /api/; # a node's slash redirect keeps the prefix
            limit_conn api_conn 2000;

            location = /api/metrics {
                return 404;
            }

            location = /api/sessions {
                limit_req zone=identity burst=2000 nodelay;
                proxy_pass http://api/sessions;
            }

            location = /api/tickets {
                limit_req zone=identity burst=2000 nodelay;
                proxy_pass http://api/tickets;
            }
        }

        location = /ws {
            include /etc/nginx/security-headers.conf;
            proxy_pass http://api;
            proxy_next_upstream error timeout; # a refused upgrade may have used its one-time ticket
            proxy_buffering off;
            # Above the 25 s server heartbeat, whose pings keep a quiet socket open. A client that
            # stops reading misses a pong, and its node drops it within 50 s, before send_timeout.
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            send_timeout 60s;
        }
    }
}
