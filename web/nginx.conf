# AI-ASSISTED: the web image's nginx site: the built SPA on port 8080.
# Unknown paths fall back to index.html, so client routes survive a reload; hashed assets cache long.
# No $uri/ step: a Vite build has no directory indexes, and it would 301 a directory path.
# Each location sets Cache-Control, so each includes the security headers itself.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files $uri /index.html;
    }
}
