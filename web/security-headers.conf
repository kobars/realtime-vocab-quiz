# AI-ASSISTED: the security headers of every response; nginx drops inherited add_header lines in
# a location that sets its own, so each such location includes this file. No HSTS without TLS.
add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
